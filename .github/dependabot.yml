version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/Casedev"
      - "/src/Casedev.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
