name: Dependency vulnerability scan

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - preview
      - bench/OP-194-dependency-scanner
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: NuGet dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "8.0.x"

      - name: Audit resolved NuGet dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > dependency-scan-stderr.log
          dotnet restore Casedev.sln \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=high \
            -warnaserror:NU1903,NU1904 \
            2> >(tee dependency-scan-stderr.log >&2) | tee dependency-scan-results.log

      - name: Retain resolved vulnerability inventory
        if: always()
        shell: bash
        run: |
          dotnet list Casedev.sln package --vulnerable --include-transitive --format json \
            > dependency-scan-results.json 2>> dependency-scan-stderr.log || true

      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            dependency-scan-results.json
            dependency-scan-results.log
            dependency-scan-stderr.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce vulnerability gate
        if: steps.audit.outcome != 'success'
        run: |
          echo "The dependency audit found vulnerabilities or could not complete; review the retained evidence." >&2
          exit 1
